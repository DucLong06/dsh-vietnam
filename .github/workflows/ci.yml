name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # lib/ is committed so `dsh plugin add github:…` works without install
      # scripts (pnpm blocks them for git dependencies). It must match src/.
      - name: lib/ is up to date
        run: git diff --exit-code -- lib
